name: Deploy slides to GitHub Pages

# Publishes the presentation to GitHub Pages on every push to main.
# The archive/ folder (the private design reference) is intentionally EXCLUDED
# from the published site — it stays in the repo/git but is not served publicly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble publish directory (everything except archive/)
        run: |
          mkdir -p _site
          # Copy repo contents into _site, excluding the archive and git/CI internals.
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'archive' \
            --exclude '_site'
          # Keep .nojekyll so Pages serves files as-is (no Jekyll processing).
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
